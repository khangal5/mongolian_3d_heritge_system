services:
  - type: web
    name: mongolian-heritage-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.example
      - key: DATABASE_URL
        sync: false

  - type: web
    name: mongolian-heritage-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://your-api-domain.example/api
